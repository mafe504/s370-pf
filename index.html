<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musa Abu Hadeed - Transformative Leadership</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration for Dark Mode -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        stone: {

                            100: '#f5f5f4',

                            800: '#92400e',
                            900: '#78350f',
                            950: '#451a03',

                    }

        }

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Custom Styles -->
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .font-arabic { font-family: 'Amiri', serif; }
        
        .kintsugi-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #fbbf24, #d97706, transparent);
            opacity: 0.8;
            filter: drop-shadow(0 0 2px rgba(251, 191, 36, 0.5));
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }

        /* Custom Artist Cursor CSS - Hidden on touch devices to prevent issues */
        @media (pointer: fine) {
            body {
                cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="%23d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>') 0 24, auto;
            }
            a, button {
                cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="%23fbbf24" stroke="%23b45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>') 0 24, pointer;
            }
        }
    </style>

    <!-- React & ReactDOM -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.263.1"
        }
      }
    </script>
    <script type="module" src="https://esm.sh/run"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Heart, Users, Sprout, MapPin, Feather, ArrowRight, Anchor, Leaf, Menu, X, BookOpen, Eye, FileText, Volume2, Square } from 'lucide-react';

        // --- Components ---

        // 1. Light Rope Switch Component (Moved to left to avoid mobile menu conflict)
        const LightRope = ({ isDark, toggleTheme }) => {
            const [isPulled, setIsPulled] = useState(false);

            const handleClick = () => {
                setIsPulled(true);
                toggleTheme();
                setTimeout(() => setIsPulled(false), 300);
            };

            return (
                <div className="fixed top-0 left-6 md:left-10 z-[60] flex flex-col items-center origin-top" style={{ transform: isPulled ? 'translateY(20px)' : 'translateY(0)', transition: 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)' }}>
                <div className="h-16 md:h-24 w-0.5 bg-stone-400 dark:bg-stone-600"></div>
                <button 
                    onClick={handleClick}
                    className={`w-3 h-8 md:w-4 md:h-10 rounded-full shadow-md transition-colors duration-300 focus:outline-none ${isDark ? 'bg-stone-700 border-stone-600' : 'bg-amber-100 border-amber-200'} border-2`}
                    title={isDark ? "Turn On Lights" : "Turn Off Lights"}
                >
                    <div className={`w-full h-full rounded-full opacity-50 ${isDark ? 'bg-black' : 'bg-white'}`}></div>
                </button>
                </div>
            );
        };

        // 2. Art Magic: Ambient Gold Dust (Floating Particles)
        const AmbientGoldDust = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let width = window.innerWidth;
                let height = window.innerHeight;
                
                // Set canvas size
                const resize = () => {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                };
                window.addEventListener('resize', resize);
                resize();

                // Particle Class
                class Particle {
                constructor() {
                    this.reset();
                    // Randomize initial position
                    this.y = Math.random() * height;
                    this.life = Math.random() * 1; // Random start phase for twinkle
                }

                reset() {
                    this.x = Math.random() * width;
                    this.y = height + Math.random() * 100; // Start below screen
                    this.vy = Math.random() * 0.5 + 0.1; // Upward float speed
                    this.vx = (Math.random() - 0.5) * 0.2; // Slight drift
                    this.size = Math.random() * 2; // Varied sizes
                    this.maxLife = Math.random() * 100 + 100;
                    this.life = 0; 
                    this.opacity = 0;
                    this.fadeIn = true;
                }

                update() {
                    this.y -= this.vy;
                    this.x += this.vx;
                    
                    // Twinkle effect
                    if (this.fadeIn) {
                    this.opacity += 0.01;
                    if (this.opacity >= 0.6) this.fadeIn = false;
                    } else {
                    this.opacity -= 0.01;
                    if (this.opacity <= 0.1) this.fadeIn = true;
                    }

                    // Reset if off screen
                    if (this.y < -10) {
                    this.reset();
                    }
                }

                draw() {
                    ctx.beginPath();
                    // Antique Gold Color
                    ctx.fillStyle = `rgba(217, 119, 6, ${Math.max(0, this.opacity)})`; 
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                }

                const particles = Array.from({ length: 40 }, () => new Particle());

                const animate = () => {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
                };

                animate();

                return () => window.removeEventListener('resize', resize);
            }, []);

            return <canvas ref={canvasRef} className="fixed inset-0 z-0 pointer-events-none" />;
        };

        // 3. Refined Component: Smoother Magic Bird Background (Hero Section Only)
        const MagicBirdBackground = ({ isDark }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let width, height;

                // Bird Class
                class Bird {
                constructor() {
                    this.init();
                }

                init(resetX = false) {
                    this.x = resetX ? -50 : Math.random() * width;
                    this.y = Math.random() * height * 0.6; // Top 60% of screen
                    this.vx = Math.random() * 0.8 + 0.4; 
                    this.vy = (Math.random() - 0.5) * 0.2;
                    this.wingSpan = Math.random() * 15 + 10;
                    this.flapSpeed = Math.random() * 0.003 + 0.002; 
                    this.flapOffset = Math.random() * Math.PI * 2;
                    this.opacity = Math.random() * 0.2 + 0.15; 
                }

                update(time) {
                    this.x += this.vx;
                    // Add gentle sine wave to Y for gliding feel
                    this.y += this.vy + Math.sin(time * 0.001 + this.flapOffset) * 0.3;
                    if (this.x > width + 50) {
                    this.init(true);
                    }
                }

                draw(time) {
                    ctx.beginPath();
                    // Adjust bird color based on theme
                    ctx.strokeStyle = isDark ? `rgba(200, 200, 200, ${this.opacity})` : `rgba(60, 60, 55, ${this.opacity})`; 
                    ctx.lineWidth = 1.5;

                    const wingY = Math.sin(time * this.flapSpeed + this.flapOffset) * 6;
                    ctx.moveTo(this.x - this.wingSpan/2, this.y + wingY);
                    ctx.quadraticCurveTo(this.x, this.y - 3, this.x + this.wingSpan/2, this.y + wingY);
                    ctx.stroke();
                }
                }

                let birds = [];

                const resize = () => {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                };

                const initSimulation = () => {
                resize();
                birds = Array.from({ length: 15 }, () => new Bird()); // Reduced bird count for mobile performance
                };

                const animate = (time) => {
                ctx.clearRect(0, 0, width, height);
                birds.forEach(bird => { bird.update(time); bird.draw(time); });
                animationFrameId = requestAnimationFrame(animate);
                };

                initSimulation();
                window.addEventListener('resize', resize);
                animate(0);

                return () => {
                window.removeEventListener('resize', resize);
                cancelAnimationFrame(animationFrameId);
                };
            }, [isDark]); 

            return <canvas ref={canvasRef} className="absolute inset-0 z-0 pointer-events-none" />;
        };

        const FadeIn = ({ children, delay = 0 }) => {
            const [isVisible, setIsVisible] = useState(false);
            const domRef = React.useRef();

            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => setIsVisible(entry.isIntersecting));
                });
                const currentElement = domRef.current;
                if (currentElement) observer.observe(currentElement);
                return () => {
                if (currentElement) observer.unobserve(currentElement);
                };
            }, []);

            return (
                <div
                ref={domRef}
                className={`transition-all duration-1000 ease-out transform ${
                    isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'
                }`}
                style={{ transitionDelay: `${delay}ms` }}
                >
                {children}
                </div>
            );
        };

        const SectionHeading = ({ children, align = "center" }) => (
            <h2 className={`text-3xl md:text-5xl font-serif text-stone-800 dark:text-stone-100 mb-6 md:mb-8 relative inline-block ${align === "center" ? "text-center" : "text-left"}`}>
                {children}
                <span className="absolute -bottom-2 left-0 w-full h-1 bg-gradient-to-r from-transparent via-amber-400 to-transparent opacity-70"></span>
            </h2>
        );

        const QuoteCard = ({ text, author, accent = "amber" }) => (
            <div className="relative p-6 md:p-12 bg-stone-50 dark:bg-stone-800 border-l-4 border-amber-400 shadow-sm my-6 md:my-8 transition-colors duration-500">
                <div className="absolute top-2 left-2 md:top-4 md:left-4 text-4xl md:text-6xl text-stone-200 dark:text-stone-600 font-serif leading-none">"</div>
                <p className="relative z-10 text-lg md:text-2xl font-serif text-stone-700 dark:text-stone-200 italic leading-relaxed">
                {text}
                </p>
                {author && (
                <p className="mt-4 text-xs md:text-sm font-bold text-stone-500 dark:text-stone-400 uppercase tracking-widest">
                    — {author}
                </p>
                )}
            </div>
        );

        const NavLink = ({ href, children, onClick }) => (
            <a 
                href={href} 
                onClick={onClick}
                className="text-stone-600 dark:text-stone-300 hover:text-amber-600 dark:hover:text-amber-400 font-medium tracking-wide transition-colors duration-300 relative group"
            >
                {children}
                <span className="absolute -bottom-1 left-0 w-0 h-0.5 bg-amber-500 transition-all duration-300 group-hover:w-full"></span>
            </a>
        );

        // Generic Modal Component
        const GenericModal = ({ isOpen, onClose, url, title }) => {
            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8">
                <div 
                    className="absolute inset-0 bg-stone-900/80 backdrop-blur-sm" 
                    onClick={onClose}
                ></div>
                <div className="relative bg-white w-full max-w-4xl h-[85vh] md:h-[80vh] rounded-lg shadow-2xl flex flex-col overflow-hidden animate-fadeIn mt-8 md:mt-0">
                    <div className="flex justify-between items-center p-3 md:p-4 border-b border-stone-200 bg-stone-50">
                    <h3 className="font-serif text-lg md:text-xl text-stone-800 truncate pr-4">{title}</h3>
                    <button 
                        onClick={onClose}
                        className="p-2 hover:bg-stone-200 rounded-full transition-colors text-stone-600 flex-shrink-0"
                    >
                        <X size={24} />
                    </button>
                    </div>
                    <div className="flex-1 w-full h-full bg-stone-100 overflow-hidden">
                    <iframe 
                        src={url} 
                        className="w-full h-full border-none" 
                        title="Content"
                        allow="autoplay"
                    ></iframe>
                    </div>
                </div>
                </div>
            );
        };

        function App() {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [activeLang, setActiveLang] = useState(null);
            const [availableVoices, setAvailableVoices] = useState([]);
            const [modalContent, setModalContent] = useState(null);
            
            // Dark Mode State
            const [isDarkMode, setIsDarkMode] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            useEffect(() => {
                const loadVoices = () => {
                const voices = window.speechSynthesis.getVoices();
                setAvailableVoices(voices);
                };
                loadVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = loadVoices;
                }
            }, []);

            // Toggle Dark Mode Logic
            const toggleTheme = () => {
                setIsDarkMode(!isDarkMode);
            };

            const articleUrl = "https://docs.google.com/document/d/1Bo3p154MNRQllaDKhtK-qEuAS0ZZgeQu_hInotbBmek/preview";
            const sketch1Url = "https://docs.google.com/viewer?url=https://raw.githubusercontent.com/mafe504/s370-pf/main/files/sketch2%20(1).pdf&embedded=true";
            const sketch2Url = "https://docs.google.com/viewer?url=https://raw.githubusercontent.com/mafe504/s370-pf/main/files/sketch3%20(1).pdf&embedded=true";
            const emergentSketchUrl = "https://docs.google.com/viewer?url=https://raw.githubusercontent.com/mafe504/s370-pf/main/files/sketch1%20(1).pdf&embedded=true";

            const openModal = (title, url) => {
                setModalContent({ title, url });
                document.body.style.overflow = 'hidden';
            };

            const closeModal = () => {
                setModalContent(null);
                document.body.style.overflow = 'unset';
            };

            const speak = (text, lang) => {
                if (!('speechSynthesis' in window)) {
                alert("Text-to-speech is not supported in this browser.");
                return;
                }

                window.speechSynthesis.cancel();

                if (activeLang === lang) {
                setActiveLang(null);
                return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                
                let voices = window.speechSynthesis.getVoices();
                if (voices.length === 0) voices = availableVoices;

                if (voices.length > 0) {
                const voice = voices.find(v => v.lang === lang) || 
                                voices.find(v => v.lang.startsWith(lang)) ||
                                voices.find(v => v.lang.includes(lang));
                if (voice) {
                    utterance.voice = voice;
                }
                }

                utterance.lang = lang;
                utterance.rate = 0.85;
                
                utterance.onend = () => setActiveLang(null);
                
                utterance.onerror = (e) => {
                if (e.error === 'interrupted' || e.error === 'canceled') {
                    return;
                }
                console.error("Speech error:", e); 
                setActiveLang(null); 
                };

                setTimeout(() => {
                window.speechSynthesis.speak(utterance);
                setActiveLang(lang);
                }, 50);
            };

            const englishPoem = `As you prepare your breakfast, think of others (do not forget the pigeon's food).\nAs you conduct your wars, think of others (do not forget those who seek peace).\nAs you pay your water bill, think of others (those who are nursed by clouds).\nAs you return home, to your home, think of others (do not forget the people of the tents).\nAs you sleep and count the stars, think of others...`;
            const arabicPoem = `وأنتَ تُعِدُّ فطورك، فكِّر بغيركَ، لا تَنْسَ قوتَ الحمام.\nوأنتَ تخوضُ حروبكَ، فكِّر بغيركَ، لا تنس مَنْ يطلبون السلام.\nوأنتَ تسدد فاتورةَ الماء، فكِّر بغيركَ، مَنْ يرضَعُون الغمامٍ.\nوأنتَ تعودُ إلى البيت، بيتكَ، فكِّر بغيركَ، لا تنس شعب الخيامْ.\nوأنت تنام وتُحصي الكواكبَ، فكِّر بغيركَ...`;

            return (
                <div className={`${isDarkMode ? 'dark' : ''}`}>
                <div className="min-h-screen bg-[#faf9f6] dark:bg-stone-950 text-stone-800 dark:text-stone-100 font-sans overflow-x-hidden selection:bg-amber-200 transition-colors duration-500">
                    
                    {/* Light Rope Switch - Moved to Left to avoid mobile menu overlap */}
                    <LightRope isDark={isDarkMode} toggleTheme={toggleTheme} />

                    {/* Art Magic: Ambient Floating Gold Dust */}
                    <AmbientGoldDust />

                    <GenericModal isOpen={!!modalContent} onClose={closeModal} url={modalContent?.url} title={modalContent?.title} />

                    {/* Navigation */}
                    <nav className={`fixed w-full z-50 transition-all duration-500 ${scrolled ? 'bg-white/95 dark:bg-stone-900/95 backdrop-blur-md shadow-md py-3 md:py-4' : 'bg-transparent py-4 md:py-6'}`}>
                    <div className="container mx-auto px-4 md:px-6 flex justify-between items-center relative">
                        {/* Logo Centered on Mobile, Left on Desktop to allow room for Rope on Left */}
                        <div className="w-full flex justify-center md:justify-start pl-12 md:pl-0">
                        <a href="#" className="text-xl md:text-2xl font-serif font-bold text-stone-800 dark:text-white tracking-wider relative">
                            MUSA<span className="text-amber-500">.</span>
                        </a>
                        </div>
                        
                        <div className="hidden md:flex space-x-8 items-center">
                        <NavLink href="#leadership">Leadership</NavLink>
                        <NavLink href="#body-politics">Body Politics</NavLink>
                        <NavLink href="#emergent-strategy">Emergent Strategy</NavLink>
                        <NavLink href="#reflection">Reflection</NavLink>
                        </div>
                        
                        {/* Mobile Menu Button - Absolute Right */}
                        <button className="md:hidden text-stone-800 dark:text-stone-200 p-2 absolute right-4 top-1/2 transform -translate-y-1/2 z-50 focus:outline-none" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                        {isMenuOpen ? <X size={28} /> : <Menu size={28} />}
                        </button>
                    </div>
                    
                    {isMenuOpen && (
                        <div className="fixed inset-0 bg-white/95 dark:bg-stone-900/95 backdrop-blur-xl z-40 flex flex-col justify-center items-center space-y-8 animate-fadeIn md:hidden">
                        <a href="#leadership" className="text-2xl font-serif text-stone-800 dark:text-stone-100" onClick={() => setIsMenuOpen(false)}>Leadership</a>
                        <a href="#body-politics" className="text-2xl font-serif text-stone-800 dark:text-stone-100" onClick={() => setIsMenuOpen(false)}>Body Politics</a>
                        <a href="#emergent-strategy" className="text-2xl font-serif text-stone-800 dark:text-stone-100" onClick={() => setIsMenuOpen(false)}>Emergent Strategy</a>
                        <a href="#reflection" className="text-2xl font-serif text-stone-800 dark:text-stone-100" onClick={() => setIsMenuOpen(false)}>Reflection</a>
                        </div>
                    )}
                    </nav>

                    {/* Hero Section */}
                    <header className="relative min-h-screen flex items-center justify-center overflow-hidden bg-[#f0f0eb] dark:bg-stone-950 transition-colors duration-500 pt-20 md:pt-0 pb-16">
                    <MagicBirdBackground isDark={isDarkMode} />
                    <div className="absolute inset-0 z-0">
                        <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cream-paper.png')] dark:opacity-5"></div>
                        <div className="kintsugi-line w-[150%] h-0.5 top-1/3 -left-1/4 rotate-12"></div>
                        <div className="kintsugi-line w-[80%] h-0.5 bottom-1/4 right-0 -rotate-6"></div>
                    </div>
                    <div className="container mx-auto px-4 md:px-6 z-10 text-center relative">
                        <FadeIn>
                        <p className="text-amber-600 font-medium tracking-[0.2em] mb-3 md:mb-4 uppercase text-sm md:text-base">Final Portfolio</p>
                        <h1 className="text-4xl sm:text-5xl md:text-7xl lg:text-8xl font-serif text-stone-900 dark:text-white mb-4 md:mb-6 leading-tight">
                            Transformative <br/>
                            <span className="italic text-stone-600 dark:text-stone-400">Leadership</span>
                        </h1>
                        <div className="w-16 md:w-24 h-1 bg-amber-400 mx-auto mb-6 md:mb-8"></div>
                        <p className="text-lg md:text-2xl text-stone-600 dark:text-stone-300 max-w-2xl mx-auto font-light leading-relaxed px-4">
                            Centering Justice, Collective Action, and the Art of Healing.
                        </p>
                        <div className="mt-8 md:mt-12 flex flex-col sm:flex-row justify-center items-center gap-4 px-4">
                            <a href="#intro" className="w-full sm:w-auto px-6 md:px-8 py-3 bg-stone-900 dark:bg-amber-600 text-white font-medium hover:bg-amber-600 dark:hover:bg-amber-500 transition-colors duration-300 rounded-sm text-center shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                            Explore The Journey
                            </a>
                            <a href="https://docs.google.com/presentation/d/157j-qLhEHmIFJbIkvu3cipfim8PCWK2Aqhpy5w2Vpg8/edit?usp=sharing" target="_blank" rel="noopener noreferrer" className="w-full sm:w-auto px-6 md:px-8 py-3 border border-stone-400 dark:border-stone-500 text-stone-600 dark:text-stone-300 font-medium hover:border-amber-500 hover:text-amber-600 dark:hover:text-amber-400 hover:bg-white dark:hover:bg-stone-800 transition-all duration-300 rounded-sm text-center backdrop-blur-sm">
                            Slide Deck
                            </a>
